<svg width="920" height="360" viewBox="0 0 920 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="app-audit-light-title app-audit-light-desc">
  <title id="app-audit-light-title">app-audit score summary</title>
  <desc id="app-audit-light-desc">Example app-audit report summary showing an overall score of 88, a size score of 92, a build config score of 81, and a framework score of 96.</desc>
