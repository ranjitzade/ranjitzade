    <rect x="24" y="92" width="124" height="8" rx="4" fill="#e9edf5"/>
    <rect x="24" y="92" width="114" height="8" rx="4" fill="#2563eb"/>
  </g>
  <g transform="translate(432 154)">
    <rect width="172" height="116" rx="8" fill="#f8fafc" stroke="#d9dee8"/>
