<svg width="920" height="380" viewBox="0 0 920 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stack-light-title stack-light-desc">
  <title id="stack-light-title">The mobile stack I work across</title>
  <desc id="stack-light-desc">Layered diagram of the mobile stack. Product surface layer: React Native, TypeScript, React. The boundary layer: TurboModules, Fabric, JSI, native modules. Platform layer split into Android (Kotlin, Java, Gradle) and iOS (Swift, Objective-C, Xcode). Footer notes release engineering, mobile security, and observability.</desc>

  <rect width="920" height="380" fill="#ffffff"/>

  <text x="40" y="34" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">The stack I work across</text>

  <rect x="40" y="54" width="840" height="84" rx="12" fill="#f8fafc" stroke="#d9dee8"/>
  <text x="64" y="84" fill="#5c667a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Product surface</text>
  <text x="64" y="112" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="19">React Native &#183; TypeScript &#183; React</text>

  <rect x="40" y="152" width="840" height="84" rx="12" fill="#eff4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="64" y="182" fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">The boundary</text>
  <text x="64" y="210" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="19">TurboModules &#183; Fabric &#183; JSI &#183; Native modules</text>

  <rect x="40" y="250" width="412" height="84" rx="12" fill="#f8fafc" stroke="#d9dee8"/>
  <text x="64" y="280" fill="#5c667a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Android</text>
  <text x="64" y="308" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="19">Kotlin &#183; Java &#183; Gradle</text>

  <rect x="468" y="250" width="412" height="84" rx="12" fill="#f8fafc" stroke="#d9dee8"/>
  <text x="492" y="280" fill="#5c667a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">iOS</text>
  <text x="492" y="308" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="19">Swift &#183; Objective-C &#183; Xcode</text>

  <text x="40" y="360" fill="#5c667a" font-family="Arial, Helvetica, sans-serif" font-size="13">Release engineering &#183; Mobile security &#183; Observability</text>
</svg>
